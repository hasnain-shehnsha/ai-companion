name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ai_user
          POSTGRES_PASSWORD: ai_password
          POSTGRES_DB: ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt ruff
        
    - name: Run formatter (black)
      run: |
        black --check app tests main.py
        
    - name: Run linter (ruff)
      run: |
        ruff check app tests main.py
        
    - name: Run tests (SQLite)
      env:
        REDIS_URL: redis://localhost:6379/1
        QDRANT_URL: http://localhost:6333
        SECRET_KEY: test_secret_key_123
        GROQ_API_KEY: test_groq_key
        MEMORY_ENABLED: true
        WHATSAPP_TOKEN: test_token
        WHATSAPP_PHONE_NUMBER_ID: test_id
        WHATSAPP_VERIFY_TOKEN: test_verify
      run: |
        PYTHONPATH=. pytest tests/ -v -k "not test_fresh_database_migrations"
        
    - name: Run migration smoke checks (Postgres)
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://ai_user:ai_password@localhost:5432/ai_db
        REDIS_URL: redis://localhost:6379/1
        QDRANT_URL: http://localhost:6333
        SECRET_KEY: test_secret_key_123
        GROQ_API_KEY: test_groq_key
        MEMORY_ENABLED: true
        WHATSAPP_TOKEN: test_token
        WHATSAPP_PHONE_NUMBER_ID: test_id
        WHATSAPP_VERIFY_TOKEN: test_verify
      run: |
        PYTHONPATH=. pytest tests/test_migrations.py -v
